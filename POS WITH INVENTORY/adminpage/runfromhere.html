        <h1 id="greeting">Hello!</h1>
        <p class="brand-tagline">A simpler way to keep your stock organized and every sale moving.</p>
      </div>

      <main class="login-panel" aria-label="Login options">
        <h2 class="login-label">Choose your account</h2>
        <p class="login-description">Select a role to continue to SmartStock POS.</p>

        <div class="role-list">
          <button
            class="role-button"
            type="button"
            onclick="employeeLogin()"
          >
            <span class="icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="12"
                  cy="8"
                  r="4"
                  fill="#1e1e1e"
                />

                <path
                  d="M5 19C6.5 15.8 9 14 12 14C15 14 17.5 15.8 19 19"
                  stroke="#1e1e1e"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
              </svg>
            </span>

            <span class="role-copy">
              <span>Employee</span>
              <small>Access sales and daily tasks</small>
            </span>
            <span class="role-arrow" aria-hidden="true">›</span>
          </button>

          <button
            class="role-button"
            type="button"
            onclick="adminLogin()"
          >
            <span class="icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="12"
                  cy="8"
                  r="4"
                  fill="#1e1e1e"
                />

                <path
                  d="M5 19C6.5 15.8 9 14 12 14C15 14 17.5 15.8 19 19"
                  stroke="#1e1e1e"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />

                <path
                  d="M6 7L9 10L6 13"
                  stroke="#1e1e1e"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>

            <span class="role-copy">
              <span>Administrator</span>
              <small>Manage products, stock, and users</small>
            </span>
            <span class="role-arrow" aria-hidden="true">›</span>
          </button>
        </div>
      </main>

      <div class="footer">
        © 2026 SmartStock POS • Smart Inventory & JamesDrake Kalbo
      </div>

    <script>
      const hour = new Date().getHours();
      const greeting = hour >= 5 && hour < 12
        ? "Good morning"
        : hour >= 12 && hour < 18
          ? "Good afternoon"
          : "Good evening";
      document.getElementById("greeting").textContent = `Hello, ${greeting}!`;

      function employeeLogin() {
        window.location.href = "employee-login.html";
      }

      function adminLogin() {
        window.location.href = "Login.html";
      }
    </script>
